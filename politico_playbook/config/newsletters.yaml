# ------------------------------------------------------------
# DOMAIN ALIASES — sender-domain to slug-source mapping
# ------------------------------------------------------------
# Some newsletters come from email.politicopro.com instead of email.politico.com.
# This list tells the ingestor which domains to treat as in-scope.
allowed_domains:
  - email.politico.com
  - email.politicopro.com
