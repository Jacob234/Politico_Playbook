# Newsletter Registry
#
# Sender slug (the part before @email.politico.com) is the unique key.
# Registry-driven: edit this file to add, disable, or re-route newsletters.
# No code change required.
#
# Fields:
#   display_name: Human-readable name for reports.
#   parser:      Parser identifier. 'default' = generic Politico parser.
#                Use 'pro_multi_vertical' for politicopro.com sender (subject-routed).
#   priority:    1 (top) – 5 (low). Used to throttle Stage 2 spend if budget is tight.
#   active:      Set false to ignore the newsletter without removing the entry.
#   notes:       Optional human notes (cadence, gotchas, parser tweaks).

newsletters:
  # ------------------------------------------------------------
  # FLAGSHIP PLAYBOOK FAMILY
  # ------------------------------------------------------------
  politicoplaybook:
    display_name: "POLITICO Playbook (AM/PM)"
    parser: default
    priority: 1
    active: true
    notes: "Same sender for AM and PM; disambiguate by time of day in subject if needed."

